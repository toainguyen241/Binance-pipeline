# docker-compose.yml
x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  kafka:
    image: apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
    container_name: kafka
    profiles: ["infra"]
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 8
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_CLEANUP_POLICY: delete
      KAFKA_LOG_RETENTION_HOURS: ${KAFKA_RETENTION_HOURS:-168}
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000
      KAFKA_LOG_SEGMENT_BYTES: 268435456
      KAFKA_OFFSETS_RETENTION_MINUTES: ${KAFKA_OFFSETS_RETENTION_MINUTES:-10080}
    volumes:
      - kafka_data:/var/lib/kafka/data
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - pipeline_net

  producer:
    build:
      context: .
      dockerfile: src/producer/Dockerfile
    container_name: binance-producer
    profiles: ["infra"]
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped
    init: true
    logging: *default-logging
    env_file:
      - path: .env
        required: false
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      PRODUCER_HEARTBEAT_FILE: /tmp/producer-heartbeat
      PRODUCER_HEARTBEAT_INTERVAL_SECONDS: ${PRODUCER_HEARTBEAT_INTERVAL_SECONDS:-5}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os,time; p='/tmp/producer-heartbeat'; raise SystemExit(not os.path.exists(p) or time.time()-os.path.getmtime(p)>60)",
        ]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s
    networks:
      - pipeline_net

  clickhouse:
    image: clickhouse/clickhouse-server:26.7.2.59@sha256:4fe3351f643fec83f751b1991077b50354aaa8789c044ef1afe11098ec8b289a
    container_name: clickhouse
    profiles: ["infra"]
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: binance
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "clickhouse-client --user \"$$CLICKHOUSE_USER\" --password \"$$CLICKHOUSE_PASSWORD\" --query 'SELECT 1' >/dev/null",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging
    networks:
      - pipeline_net

  retention-init:
    image: clickhouse/clickhouse-server:26.7.2.59@sha256:4fe3351f643fec83f751b1991077b50354aaa8789c044ef1afe11098ec8b289a
    container_name: retention-init
    profiles: ["infra"]
    depends_on:
      clickhouse:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/retention/configure_retention.sh"]
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_RETENTION_DAYS: ${CLICKHOUSE_RETENTION_DAYS:-7}
    volumes:
      - ./clickhouse/configure_retention.sh:/retention/configure_retention.sh:ro
    logging: *default-logging
    networks:
      - pipeline_net

  runtime-maintenance:
    build:
      context: .
      dockerfile: src/maintenance/Dockerfile
    container_name: runtime-maintenance
    profiles: ["infra"]
    restart: unless-stopped
    init: true
    logging: *default-logging
    environment:
      CHECKPOINT_RETENTION_DAYS: ${CHECKPOINT_RETENTION_DAYS:-7}
      AIRFLOW_LOG_RETENTION_DAYS: ${AIRFLOW_LOG_RETENTION_DAYS:-7}
      MAINTENANCE_INTERVAL_SECONDS: ${MAINTENANCE_INTERVAL_SECONDS:-86400}
    volumes:
      - flink_checkpoints:/data/flink-checkpoints
      - spark_checkpoints:/data/spark-raw-checkpoints
      - spark_checkpoints_windowed:/data/spark-windowed-checkpoints
      - airflow_logs:/data/airflow-logs
    networks:
      - pipeline_net

  spark-microbatch:
    build:
      context: .
      dockerfile: src/consumer/Dockerfile.spark
    container_name: spark-microbatch
    profiles: ["spark-microbatch"]
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      retention-init:
        condition: service_completed_successfully
    restart: on-failure
    stop_grace_period: 30s
    init: true
    logging: *default-logging
    env_file:
      - path: .env
        required: false
    environment:
      CHECKPOINT_LOCATION: ${SPARK_MICROBATCH_CHECKPOINT_LOCATION:-/tmp/checkpoints/binance_microbatch_tuned_v2}
      SPARK_RAW_TRIGGER_INTERVAL: ${SPARK_RAW_TRIGGER_INTERVAL:-5 seconds}
      SPARK_SHUFFLE_PARTITIONS: ${SPARK_SHUFFLE_PARTITIONS:-8}
      SPARK_MAX_OFFSETS_PER_TRIGGER: ${SPARK_MAX_OFFSETS_PER_TRIGGER:-5000}
    volumes:
      - spark_checkpoints:/tmp/checkpoints
    networks:
      - pipeline_net

  spark-windowed:
    build:
      context: .
      dockerfile: src/consumer/Dockerfile.spark-windowed
    container_name: spark-windowed
    profiles: ["spark-microbatch"]
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      retention-init:
        condition: service_completed_successfully
    restart: on-failure
    stop_grace_period: 30s
    init: true
    logging: *default-logging
    env_file:
      - path: .env
        required: false
    environment:
      CHECKPOINT_LOCATION: ${SPARK_WINDOWED_CHECKPOINT_LOCATION:-/tmp/checkpoints/binance_windowed_agg_tuned_v3}
      SPARK_WINDOW_DURATION: ${SPARK_WINDOW_DURATION:-10 seconds}
      SPARK_WATERMARK_DELAY: ${SPARK_WATERMARK_DELAY:-10 seconds}
      SPARK_WINDOWED_TRIGGER_INTERVAL: ${SPARK_WINDOWED_TRIGGER_INTERVAL:-10 seconds}
      SPARK_WINDOWED_OUTPUT_MODE: ${SPARK_WINDOWED_OUTPUT_MODE:-update}
      SPARK_SHUFFLE_PARTITIONS: ${SPARK_SHUFFLE_PARTITIONS:-8}
      SPARK_MAX_OFFSETS_PER_TRIGGER: ${SPARK_MAX_OFFSETS_PER_TRIGGER:-5000}
    volumes:
      - spark_checkpoints_windowed:/tmp/checkpoints
    networks:
      - pipeline_net


  flink:
    build:
      context: .
      dockerfile: src/consumer/Dockerfile.flink
    container_name: flink
    profiles: ["flink"]
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      retention-init:
        condition: service_completed_successfully
    restart: on-failure
    stop_grace_period: 30s
    init: true
    logging: *default-logging
    env_file:
      - path: .env
        required: false
    environment:
      FLINK_CHECKPOINT_STORAGE_URI: ${FLINK_CHECKPOINT_STORAGE_URI:-file:///opt/flink/checkpoints}
      FLINK_CHECKPOINT_INTERVAL_MS: ${FLINK_CHECKPOINT_INTERVAL_MS:-10000}
      FLINK_CHECKPOINT_MIN_PAUSE_MS: ${FLINK_CHECKPOINT_MIN_PAUSE_MS:-5000}
      FLINK_CHECKPOINT_TIMEOUT_MS: ${FLINK_CHECKPOINT_TIMEOUT_MS:-60000}
      FLINK_PARTITION_DISCOVERY_INTERVAL_MS: ${FLINK_PARTITION_DISCOVERY_INTERVAL_MS:-10000}
      FLINK_CONSUMER_GROUP_ID: ${FLINK_CONSUMER_GROUP_ID:-flink-ohlc-consumer-by-engine-v2}
      FLINK_WINDOW_SIZE_SECONDS: ${FLINK_WINDOW_SIZE_SECONDS:-10}
      FLINK_WATERMARK_DELAY_SECONDS: ${FLINK_WATERMARK_DELAY_SECONDS:-3}
      FLINK_WATERMARK_IDLENESS_SECONDS: ${FLINK_WATERMARK_IDLENESS_SECONDS:-30}
      FLINK_ALLOWED_LATENESS_SECONDS: ${FLINK_ALLOWED_LATENESS_SECONDS:-10}
      FLINK_RAW_BUFFER_SIZE: ${FLINK_RAW_BUFFER_SIZE:-500}
      FLINK_RAW_FLUSH_INTERVAL_MS: ${FLINK_RAW_FLUSH_INTERVAL_MS:-500}
      FLINK_OHLC_BUFFER_SIZE: ${FLINK_OHLC_BUFFER_SIZE:-8}
      FLINK_OHLC_FLUSH_INTERVAL_MS: ${FLINK_OHLC_FLUSH_INTERVAL_MS:-5000}
      FLINK_LATE_TRADE_LOG_EVERY: ${FLINK_LATE_TRADE_LOG_EVERY:-10000}
    volumes:
      - flink_checkpoints:/opt/flink/checkpoints
    networks:
      - pipeline_net

  dashboard:
    build:
      context: .
      dockerfile: src/dashboard/Dockerfile
    container_name: dashboard
    profiles: ["dashboard"]
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      retention-init:
        condition: service_completed_successfully
    restart: unless-stopped
    init: true
    logging: *default-logging
    ports:
      - "8000:8000"
    volumes:
      - ./src/dashboard:/app/src/dashboard
    networks: [pipeline_net]
    env_file:
      - path: .env
        required: false
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      KAFKA_TOPIC: binance-trades
      PIPELINE_ACTIVE_ENGINE: ${PIPELINE_ACTIVE_ENGINE:-flink}
      PIPELINE_CONSUMER_GROUP_ID: ${FLINK_CONSUMER_GROUP_ID:-flink-ohlc-consumer-by-engine-v2}
      PIPELINE_PROGRESS_WINDOW_SECONDS: ${PIPELINE_PROGRESS_WINDOW_SECONDS:-30}
      PIPELINE_MAX_LAG_RECORDS: ${PIPELINE_MAX_LAG_RECORDS:-10000}
      PIPELINE_FRESHNESS_THRESHOLD_SECONDS: ${PIPELINE_FRESHNESS_THRESHOLD_SECONDS:-60}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json,urllib.request; d=json.load(urllib.request.urlopen('http://localhost:8000/health', timeout=5)); raise SystemExit(d.get('status')!='ok')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s


  airflow-postgres:
    image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
    container_name: airflow-postgres
    profiles: ["airflow"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: airflow
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - pipeline_net

  airflow-init:
    build:
      context: .
      dockerfile: src/airflow/Dockerfile
    container_name: airflow-init
    profiles: ["airflow"]
    depends_on:
      airflow-postgres:
        condition: service_healthy
    environment: &airflow-common-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@airflow-postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: ${AIRFLOW_DAGS_ARE_PAUSED_AT_CREATION:-false}
    env_file:
      - path: .env
        required: false
    entrypoint: >-
      bash -c "airflow db migrate &&
      (airflow users list | grep -wq \"$$AIRFLOW_ADMIN_USER\" ||
      airflow users create --username \"$$AIRFLOW_ADMIN_USER\" --password \"$$AIRFLOW_ADMIN_PASSWORD\"
      --firstname Kai --lastname DE --role Admin --email admin@example.com)"
    logging: *default-logging
    volumes:
      - ./src/airflow/dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
    networks:
      - pipeline_net

  airflow-webserver:
    build:
      context: .
      dockerfile: src/airflow/Dockerfile
    container_name: airflow-webserver
    profiles: ["airflow"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-common-env
    env_file:
      - path: .env
        required: false
    command: airflow webserver
    restart: unless-stopped
    init: true
    logging: *default-logging
    ports:
      - "8080:8080"
    volumes:
      - ./src/airflow/dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
    networks:
      - pipeline_net

  airflow-scheduler:
    build:
      context: .
      dockerfile: src/airflow/Dockerfile
    container_name: airflow-scheduler
    profiles: ["airflow"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-common-env
    env_file:
      - path: .env
        required: false
    command: airflow scheduler
    restart: unless-stopped
    init: true
    logging: *default-logging
    volumes:
      - ./src/airflow/dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
    networks:
      - pipeline_net


networks:
  pipeline_net:
    driver: bridge

volumes:
  kafka_data:
  clickhouse_data:
  spark_checkpoints:
  spark_checkpoints_windowed:
  flink_checkpoints:
  airflow_postgres_data:
  airflow_logs:
